[package]
name = "zincha-cli"
description = "Public Zincha developer CLI."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["zincha", "blockchain", "sdk"]

[[bin]]
name = "zincha"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
zincha-cli-core = { version = "0.1.0", path = "../zincha-cli-core" }

[dev-dependencies]
bincode.workspace = true
zincha-primitives = { version = "0.1.0", path = "../zincha-primitives" }
hex.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
x509-parser.workspace = true
