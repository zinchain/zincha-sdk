[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zincha"
version = "0.1.1"
description = "Python client SDK for the ZINCHA chain"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "ZINCHA Contributors" },
]
keywords = ["zincha", "blockchain", "sdk", "client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=42,<47",
  "jcs>=0.2,<1",
  "PyNaCl>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/zinchain/zincha-sdk"
Repository = "https://github.com/zinchain/zincha-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zincha = ["py.typed"]
