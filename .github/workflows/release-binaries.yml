name: Release Binaries

on:
  # Dispatch explicitly after the source tag and upload credential are ready.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms to build, or all (use a subset to retry missing assets)"
        required: false
        default: all
        type: string
      force_republish:
        description: "Replace existing assets in zincha-releases"
        required: false
        default: false
        type: boolean

concurrency:
  group: sdk-validation
  cancel-in-progress: false

env:
  RUST_TEST_THREADS: "1"
  CARGO_BUILD_JOBS: "1"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  offline-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9

      - name: Run offline CI gate
        run: |
          python -m pip install ./sdk/python
          scripts/ci-offline.sh

  ensure-release:
    needs: offline-gate
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      force_republish: ${{ steps.tag.outputs.force_republish }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          FORCE_REPUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_republish == true }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+ ]]; then
            echo "::error::release tag must start with v followed by a number: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "force_republish=$FORCE_REPUBLISH" >> "$GITHUB_OUTPUT"

      - name: Resolve selected platforms
        id: platforms
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          platforms = [
              {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "platform": "linux-x86_64", "binary": "zincha"},
              {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "platform": "linux-aarch64", "binary": "zincha"},
              {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "platform": "macos-x86_64", "binary": "zincha"},
              {"os": "macos-15", "target": "aarch64-apple-darwin", "platform": "macos-aarch64", "binary": "zincha"},
              {"os": "windows-2022", "target": "x86_64-pc-windows-msvc", "platform": "windows-x86_64", "binary": "zincha.exe"},
          ]
          requested = os.environ["INPUT_PLATFORMS"].strip() or "all"
          if requested != "all":
              names = [name.strip() for name in requested.split(",")]
              allowed = {platform["platform"] for platform in platforms}
              if len(names) != len(set(names)) or not set(names) <= allowed:
                  raise SystemExit("Invalid or duplicate platforms; select from: " + ", ".join(sorted(allowed)))
              platforms = [platform for platform in platforms if platform["platform"] in names]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": platforms}, separators=(",", ":")) + "\n")
          PYTHON

      - name: Ensure aggregate release exists
        env:
          GH_TOKEN: ${{ secrets.ZINCHA_RELEASES_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ZINCHA_RELEASES_TOKEN is required to upload to zinchain/zincha-releases"
            exit 1
          fi
          if ! gh release view "$TAG_NAME" -R zinchain/zincha-releases >/dev/null 2>&1; then
            gh release create "$TAG_NAME" -R zinchain/zincha-releases \
              --draft \
              --prerelease \
              --title "Zincha $TAG_NAME" \
              --notes "Draft aggregate Zincha binary release for $TAG_NAME. Run the finalizer after all required source assets upload."
          fi

  build:
    needs:
      - offline-gate
      - ensure-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.ensure-release.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      TAG_NAME: ${{ needs.ensure-release.outputs.tag }}
      FORCE_REPUBLISH: ${{ needs.ensure-release.outputs.force_republish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release binary
        run: cargo build --release --locked -p zincha-cli --target ${{ matrix.target }}

      - name: Smoke-test binary
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package binary
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          SOURCE_REPO: zinchain/zincha-sdk
          SOURCE_TAG: ${{ env.TAG_NAME }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/package-cli-binary.sh "$TAG_NAME" "${{ matrix.target }}" "${{ matrix.platform }}"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/zincha-${{ env.TAG_NAME }}-${{ matrix.platform }}.*

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZINCHA_RELEASES_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ZINCHA_RELEASES_TOKEN is required to upload to zinchain/zincha-releases"
            exit 1
          fi
          args=(release upload "$TAG_NAME" -R zinchain/zincha-releases)
          if [ "$FORCE_REPUBLISH" = "true" ]; then
            args+=(--clobber)
          fi
          gh "${args[@]}" dist/zincha-"$TAG_NAME"-"$PLATFORM".*
