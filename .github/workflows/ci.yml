name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sdk-validation
  cancel-in-progress: false

env:
  RUST_TEST_THREADS: "1"
  CARGO_BUILD_JOBS: "1"

permissions:
  contents: read

jobs:
  offline:
    name: Offline SDK CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Isolate Rust toolchain installation
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/zincha-rustup" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9

      - name: Run offline SDK CI
        # Install declared runtime dependencies before the offline test phase.
        # Conversation crypto and canonical JSON are no longer stdlib-only.
        run: |
          python -m pip install ./sdk/python
          scripts/ci-offline.sh

  python-compat:
    needs: offline
    name: Python SDK ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python SDK tests
        working-directory: sdk/python
        run: |
          python -m pip install .
          PYTHONPATH=src python -m unittest discover -s tests
